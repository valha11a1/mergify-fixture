queue_rules:
  - name: default
    merge_method: squash
    allow_inplace_checks: false
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - "#approved-reviews-by>=1"
      - check-success=integration-gate

pull_request_rules:
  - name: auto-approve on trusted label
    conditions:
      - base=main
      - label=trusted-approve
    actions:
      review:
        type: APPROVE
        message: auto-approved by mergify automation
  - name: queue on label
    conditions:
      - base=main
      - label=ready-to-merge
    actions:
      queue:
        name: default
